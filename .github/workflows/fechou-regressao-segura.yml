name: FECHOU | Regressao sem transacoes
on:
  push:
    branches:
      - qa/fechou-fluxo-estabilidade-2026-11-18
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter codigo da revisao
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe, chat, fotos, desempenho e exposicao de contas
        run: node qa/test-chat-flow-stability.cjs
      - name: Conciliação de reembolsos simulada
        run: node qa/test-admin-refund-reconciliation.cjs
      - name: Eventos webhook checkout simulados
        run: node qa/test-checkout-webhook-hotfix.cjs
      - name: Repeticao de webhook estornado simulada
        run: node qa/test-prepay-refunded-replay.cjs

  visual-anonimo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Obter codigo e baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar baseline main
        run: git show origin/main:index.html > qa/baseline-main.html
      - name: Preparar Chromium/Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capturar antes/depois em mobile e desktop sem login
        run: node qa/test-visual-anon.cjs
      - name: Guardar capturas diretamente na branch de QA
        if: github.event_name == 'push' && github.ref == 'refs/heads/qa/fechou-fluxo-estabilidade-2026-11-18'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "test: prints visuais anonimos antes/depois [skip ci]"
            git push origin HEAD:qa/fechou-fluxo-estabilidade-2026-11-18
          fi
