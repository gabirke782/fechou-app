name: Empacotar publicacao FECHOU R20.1
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Conferir candidato e preservar index na raiz
        run: |
          test -f index.html
          grep -q 'data-fechou-revision="R20.1-2026-11-17-chat-compacto"' index.html
          cmp index.html auditoria/R18/candidato/index.html
          sha256sum index.html
          mkdir -p deploy
          cp index.html deploy/index.html
      - name: Publicar artefato ZIP privado (sem deploy automatico)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fechou-r20-1-publicar
          path: deploy/
          retention-days: 1
          if-no-files-found: error
